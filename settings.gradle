pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
        exclusiveContent {
            forRepository {
                maven {
                    name = 'Fabric'
                    url = uri('https://maven.fabricmc.net')
                }
            }
            filter {
                includeGroupAndSubgroups('net.fabricmc')
                includeGroup('fabric-loom')
            }
        }
        exclusiveContent {
            forRepository {
                maven {
                    name = 'Forge'
                    url = uri('https://maven.minecraftforge.net')
                }
            }
            filter {
                includeGroupAndSubgroups('net.minecraftforge')
            }
        }
        exclusiveContent {
            forRepository {
                maven {
                    name = 'Sponge Snapshots'
                    url = uri('https://repo.spongepowered.org/repository/maven-public')
                }
            }
            filter {
                includeGroupAndSubgroups('org.spongepowered')
            }
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'Numen'
// 三兄弟布局:core/(模组本体)、api/(引擎,曾是独立仓)、ai/(LLM 连接层,纯 JVM)。
// 单一构建:core 直接以 project 依赖消费 api,api 消费 agent,agent 消费 ai,不经 maven 中转。
include('core:common')
include('core:fabric')
include('core:forge')
include('api:common')
include('api:fabric')
include('api:forge')
include('ai')
// numen-agent:大脑本身(队列、目标),纯 JVM,依赖 ai、被 api 依赖(详见 agent/build.gradle 头注)。
include('agent')
include('ui')

// 联动模块:一个联动一个,内嵌发布不单独发坐标。见 buildSrc 的 numen-plugin.gradle
include('plugins:ysm')
include('plugins:tlm')
include('plugins:kaleidoscope')
include('plugins:curios')
include('plugins:ftbquests')
